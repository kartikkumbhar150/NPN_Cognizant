<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPN Bank | AI Assistant</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0f172a; /* Slate 900 */
            --bg-glass: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
            --border-glass: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6; /* Blue 500 */
            --primary-hover: #2563eb; /* Blue 600 */
            --text-main: #f8fafc; /* Slate 50 */
            --text-muted: #94a3b8; /* Slate 400 */
            --message-user: #3b82f6;
            --message-bot: rgba(30, 41, 59, 0.9);
            --font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Glassmorphism Container */
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .header-actions {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Login Screen */
        .login-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .login-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .login-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-card h2 {
            margin-bottom: 8px;
            font-size: 1.5rem;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 16px;
        }

        .login-input:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Chat Area */
        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Scrollbar */
        .chat-body::-webkit-scrollbar {
            width: 6px;
        }
        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Messages */
        .message-wrapper {
            display: flex;
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-wrapper.bot {
            justify-content: flex-start;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .message.user {
            background: var(--message-user);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .message.bot {
            background: var(--message-bot);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }
        
        /* Loading Animation */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 16px 20px;
            background: var(--message-bot);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Sources & Recommendations Pill */
        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 100px;
            font-size: 0.75rem;
            color: #60a5fa;
            margin-top: 12px;
            font-weight: 600;
        }

        /* Input Area */
        .chat-footer {
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid var(--border-glass);
        }

        .input-group {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 8px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group:focus-within {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-family: var(--font-family);
            font-size: 1rem;
            padding: 12px 16px;
            resize: none;
            outline: none;
            max-height: 150px;
            min-height: 24px;
            overflow-y: hidden;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .send-btn:disabled {
            background: rgba(255,255,255,0.1);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Login Screen overlay -->
        <div class="login-screen" id="loginScreen">
            <div class="login-card">
                <div class="brand-icon" style="margin: 0 auto 20px auto; width: 56px; height: 56px;">
                    <i data-lucide="brain" style="color: white; width: 32px; height: 32px;"></i>
                </div>
                <h2>NPN Bank AI</h2>
                <p>Enter your registered email to continue</p>
                <form id="loginForm">
                    <input type="email" id="emailInput" class="login-input" placeholder="e.g. priya.sharma@example.com" required autocomplete="email">
                    <button type="submit" class="btn-primary">Connect to AI</button>
                </form>
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-header">
            <div class="header-brand">
                <div class="brand-icon">
                    <i data-lucide="sparkles" style="color: white; width: 20px; height: 20px;"></i>
                </div>
                <div>
                    <div class="header-title">NPN Bank Assistant</div>
                    <div class="header-subtitle" id="userEmailDisplay">Connecting...</div>
                </div>
            </div>
            <div class="header-actions">
                <span class="status-dot"></span> Online
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <!-- Messages will be injected here -->
            <div class="message-wrapper bot">
                <div class="message bot">
                    Hello! I'm your NPN Bank AI Assistant. How can I help you today?
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <textarea id="messageInput" placeholder="Ask about your accounts, cards, or investments..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" disabled>
                    <i data-lucide="send" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // State
        let currentEmail = '';
        const API_URL = 'https://npnbank-backend.duckdns.org/chatbot/ask/email';

        // DOM Elements
        const loginScreen = document.getElementById('loginScreen');
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const chatBody = document.getElementById('chatBody');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Login Handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (email) {
                currentEmail = email;
                userEmailDisplay.textContent = email;
                loginScreen.classList.add('hidden');
                setTimeout(() => messageInput.focus(), 500);
            }
        });

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim().length === 0;
        });

        // Handle Enter key (Shift+Enter for new line)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Reset input
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;

            // Append User Message
            appendMessage(text, 'user');

            // Show Typing Indicator
            const typingId = showTyping();

            try {
                // Call API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        email: currentEmail
                    })
                });

                const data = await response.json();
                removeElement(typingId);

                if (response.ok) {
                    appendBotMessage(data);
                } else {
                    appendMessage(`Error: ${data.detail || 'Failed to connect to AI server.'}`, 'bot');
                }
            } catch (error) {
                console.error('API Error:', error);
                removeElement(typingId);
                appendMessage('Network error. Please make sure the backend server (port 8001) is running.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            
            const msgNode = document.createElement('div');
            msgNode.className = `message ${sender}`;
            msgNode.textContent = text;
            
            wrapper.appendChild(msgNode);
            chatBody.appendChild(wrapper);
            scrollToBottom();
        }

        function appendBotMessage(data) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper bot';
            
            const msgNode = document.createElement('div');
            msgNode.className = 'message bot';
            
            // Format basic markdown (bold, newlines)
            let formattedText = data.answer
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            
            msgNode.innerHTML = formattedText;

            // Add Metadata pills if present
            if (data.intent && data.intent !== 'GENERAL_BANKING_QUERY') {
                const intentPill = document.createElement('div');
                intentPill.className = 'meta-pill';
                intentPill.innerHTML = `<i data-lucide="tag" style="width: 12px; height: 12px;"></i> ${data.intent.replace(/_/g, ' ')}`;
                msgNode.appendChild(intentPill);
            }

            if (data.recommendations && data.recommendations.length > 0) {
                const recPill = document.createElement('div');
                recPill.className = 'meta-pill';
                recPill.style.background = 'rgba(16, 185, 129, 0.1)';
                recPill.style.color = '#34d399';
                recPill.style.borderColor = 'rgba(16, 185, 129, 0.2)';
                recPill.innerHTML = `<i data-lucide="trending-up" style="width: 12px; height: 12px;"></i> Recommended: ${data.recommendations[0].product_name}`;
                msgNode.appendChild(recPill);
            }

            wrapper.appendChild(msgNode);
            chatBody.appendChild(wrapper);
            
            // Re-initialize dynamic icons
            lucide.createIcons();
            scrollToBottom();
        }

        function showTyping() {
            const id = 'typing-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper bot';
            wrapper.id = id;
            
            wrapper.innerHTML = `
                <div class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            
            chatBody.appendChild(wrapper);
            scrollToBottom();
            return id;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatBody.scrollTo({
                top: chatBody.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
